<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenView</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="portal-header">
      <h1><span class="icon-logo">&#8984; </span>GreenView</h1>
    </header>

    <main class="portal-container">
      <section class="panel form-panel">
        <div class="input-header">
          <h2 class="panel-title">Sensor Data Input</h2>
        </div>

        <div class="panel-content">
          <div id="form-error-banner" class="error-banner" role="alert"></div>
          <form action="#" id="sensor-form" novalidate>
            <div class="form-group">
              <label for="title" class="form-label"
                >Title <span class="required">*</span></label
              >
              <input
                type="text"
                class="form-input"
                id="title"
                name="title"
                placeholder="Greenhouse A"
                required
              />
              <p class="input-desc">Enter Title</p>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="ph" class="form-label"
                  >pH <span class="required">*</span></label
                >
                <input
                  type="number"
                  class="form-input"
                  id="ph"
                  name="ph"
                  min="0"
                  max="14"
                  step="0.1"
                  placeholder="7.2"
                  required
                />
                <p class="input-desc">Enter pH (0-14)</p>
              </div>
              <div class="form-group">
                <label for="temp" class="form-label"
                  >Temperature (F)<span class="required">*</span></label
                >
                <input
                  type="number"
                  class="form-input"
                  id="temp"
                  name="temp"
                  min="-100"
                  max="150"
                  step="0.1"
                  placeholder="71.3"
                  required
                />
                <p class="input-desc">Enter Temperature (F)</p>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="ec" class="form-label"
                  >EC (mS/cm) <span class="required">*</span></label
                >
                <input
                  type="number"
                  class="form-input"
                  id="ec"
                  name="ec"
                  min="0"
                  max="20"
                  step="0.1"
                  placeholder="14.3"
                  required
                />
                <p class="input-desc">Enter EC Value From 0-20 (mS/cm)</p>
              </div>
              <div class="form-group">
                <label for="rh" class="form-label"
                  >RH (%) <span class="required">*</span></label
                >
                <input
                  type="number"
                  class="form-input"
                  id="rh"
                  name="rh"
                  min="0"
                  max="100"
                  step="0.1"
                  placeholder="50.3"
                  required
                />
                <p class="input-desc">Enter Humidity (%)</p>
              </div>
            </div>
            <button type="submit" class="btn btn-primary" id="btn-submit">
              Submit Data
            </button>
          </form>
        </div>
      </section>
      <section class="panel records-panel">
        <div class="records-header">
          <h2 class="panel-title">Sensor Logs</h2>
          <div class="output-data">
            <button class="btn btn-secondary" id="btn-purge">Clear All</button>
            <p class="total-count-label">
              Total: <span class="total-count" id="total-count">0</span>
            </p>
          </div>
        </div>
        <div class="panel-content">
          <div class="empty-state" id="empty-state">
            <p>Nothing to see here.</p>
          </div>
          <ul id="records-list" class="records-grid" aria-live="polite"></ul>
        </div>
      </section>
    </main>

    <footer class="portal-footer">
      <p>&copy; 2026 GreenView Technologies Inc.</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
